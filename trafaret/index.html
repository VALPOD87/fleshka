<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор трафаретов VALPOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    background-color:#fff;background-image:linear-gradient(45deg,#d9dde2 25%,transparent 25%),linear-gradient(-45deg,#d9dde2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d9dde2 75%),linear-gradient(-45deg,transparent 75%,#d9dde2 75%);

  .tabs button.on{border-color:var(--cyan);background:rgba(51,214,240,.12);color:var(--cyan)}

  .hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Генератор трафаретов <b>VALPOD</b></h1>
  <div class="sub">Трафарет показывает, какой кусок видео проявить в другом стиле. Перетаскивай его прямо по кадру.</div>
</header>

<div class="wrap">
  <div class="stage">
    <div class="canvasBox"><canvas id="c"></canvas></div>
    <div class="transport" id="transport">
      <button class="btn" id="play">❚❚</button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0">
      <span class="time" id="time">0.0 / 5.0 с</span>
    </div>
    <div class="progress" id="prog"><i></i></div>
  </div>
  <div class="panel" id="controls"></div>
</div>
<div class="toast" id="toast"></div>

  // дотекание стартует с середины растекания и плавно разгоняется — так скорость на стыке не падает в ноль
  const S=Math.max(.05,Math.min(st.spread,st.dur)), a=st.delay+S*.5, b= st.dir==='inout' ? st.dur-S : st.dur;
  if(b<=a) return t>=a?1:0;
  return Math.min(1,Math.max(0,(t-a)/(b-a)));
}
// доля дотекания, за которую оно набирает скорость: ровно до конца растекания
function rampFor(s){
  if(s.kind!=='video') return .3;
  const S=Math.max(.05,Math.min(s.spread,s.dur)), a=s.delay+S*.5, b= s.dir==='inout' ? s.dur-S : s.dur;
  return b>a ? Math.min(.6, Math.max(.02, (S*.5)/(b-a))) : .3;
}
function fullSize(){ const e=v=>Math.max(2,Math.round(v/2)*2); return [e(st.cw*st.scale), e(st.ch*st.scale)]; }
function previewSize(){ const [W,H]=fullSize(); const k=Math.min(1, 1000/Math.max(W,H)); return [Math.round(W*k),Math.round(H*k)]; }
function setSize(W,H){ if(canvas.width!==W||canvas.height!==H){ canvas.width=W; canvas.height=H; } gl.viewport(0,0,W,H); }

function draw(g, t, o={}, cr=0){
  const s = Object.assign({}, st, o.state||{});
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uCenter, s.x/100, s.y/100);
  gl.uniform2f(U.uSize, s.w/100, s.h/100);
  gl.uniform1f(U.uRot, s.rot*Math.PI/180);
  gl.uniform1f(U.uRough, s.rough); gl.uniform1f(U.uFreq, s.freq); gl.uniform1f(U.uWarp, s.warp);
  gl.uniform1f(U.uFeather, s.feather); gl.uniform1f(U.uSeed, s.seed); gl.uniform1f(U.uGrow, g);
  gl.uniform1f(U.uTime, t); gl.uniform1f(U.uLive, s.kind==='video'?s.live:0);
  gl.uniform1f(U.uCount, s.count); gl.uniform1f(U.uPetals, s.petals); gl.uniform1f(U.uCorner, s.corner);
  gl.uniform1f(U.uMorph, s.morph?1:0); gl.uniform1f(U.uInvert, s.invert?1:0);
  gl.uniform1i(U.uShape, s.shape); gl.uniform1i(U.uEase, s.ease);
  gl.uniform1i(U.uMode, o.mode!=null?o.mode:s.mode); gl.uniform1i(U.uView, o.view!=null?o.view:s.view);
  gl.uniform1f(U.uHasA, media[0].el?1:0); gl.uniform1f(U.uHasB, media[1].el?1:0);
  gl.uniform2f(U.uSizeA, media[0].w, media[0].h); gl.uniform2f(U.uSizeB, media[1].w, media[1].h);
  gl.uniform1f(U.uCreep, cr); gl.uniform1f(U.uCreepAmt, s.creepAmt); gl.uniform1f(U.uDrips, s.drips);
  gl.uniform1f(U.uDripLen, s.dripLen); gl.uniform1f(U.uGravity, s.gravity?1:0);
  gl.uniform1f(U.uRamp, rampFor(s));
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ---------- preview loop ----------
let playing=true, t0=performance.now(), curT=0, busy=false;
const scrub=document.getElementById('scrub'), timeEl=document.getElementById('time'), playBtn=document.getElementById('play');
function loop(now){
  requestAnimationFrame(loop);
  if(busy) return;
  const [W,H]=previewSize(); setSize(W,H);
  if(st.kind==='video'){
    if(playing){ curT=((now-t0)/1000)%st.dur; scrub.value=Math.round(curT/st.dur*1000); }
    timeEl.textContent=curT.toFixed(1)+' / '+st.dur.toFixed(1)+' с';
    if(st.view===1){ syncVideos(now); uploadMedia(0); uploadMedia(1); }
    draw(growAt(curT), curT, {}, creepAt(curT));
  } else {
    if(st.view===1){ syncVideos(now); uploadMedia(0); uploadMedia(1); }
    draw(st.progress, 0, {}, st.progress);
  }
}
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'❚❚':'▶'; if(playing) t0=performance.now()-curT*1000; };
scrub.oninput=()=>{ curT=scrub.value/1000*st.dur; if(playing){ playing=false; playBtn.textContent='▶'; } };

  st.x=Math.round(Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)));

}
function changed(key){

  if(key==='dur'){ st.spread=Math.min(st.spread,st.dur); st.delay=Math.min(st.delay,Math.max(0,st.dur-.1)); refresh(); }
  if(key==='kind'||key==='shape') refresh();
  persist();
}
function refresh(){ binders.forEach(f=>f()); visRules.forEach(([n,fn])=>n.classList.toggle('hide',!fn())); }

// Random
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.round(R(a,b)), RF=(a,b)=>+R(a,b).toFixed(2);
function randomParams(keepShape){
  const s={};
  s.shape = keepShape ? st.shape : Math.floor(Math.random()*SHAPES.length);
  s.seed=RI(1,999); s.w=RI(35,85); s.h=RI(25,65); s.x=RI(35,65); s.y=RI(35,65); s.rot=RI(-20,20);
  s.rough=RF(.15,.8); s.freq=RI(3,18); s.warp=RF(0,.9); s.feather=RF(0,.7);
  s.petals=RI(3,9); s.count=RI(3,9); s.corner=RF(.05,.4); s.drips=RI(0,9); s.dripLen=RF(.2,1.1);
  if(s.shape===7){ s.rough=RF(0,.25); s.warp=RF(0,.2); s.drips=0; }
  if(s.shape===4){ s.rot=RI(-35,35); s.h=RI(12,35); }
  if(s.shape===5){ s.w=RI(60,95); s.h=RI(50,90); }
  if(s.shape===1){ s.h=RI(18,40); s.w=RI(55,90); }
  return s;
}

// держим видео-слои кадр в кадр и в такт таймлайну генератора
let vClock0=performance.now();
function syncVideos(now){
  const vids=media.filter(m=>m.el&&m.video).map(m=>m.el); if(!vids.length) return;
  const master=vids[0], D=master.duration; if(!D||!isFinite(D)) return;
  const base = st.kind==='video' ? curT : (now-vClock0)/1000;
  const target = base % D, run = st.kind!=='video' || playing;
  vids.forEach(v=>{
    const vd=v.duration&&isFinite(v.duration)?v.duration:D, tt=target%vd;
    if(run){ if(v.paused) v.play().catch(()=>{}); if(Math.abs(v.currentTime-tt)>.12 && !v.seeking) v.currentTime=tt; }
    else { if(!v.paused) v.pause(); if(Math.abs(v.currentTime-tt)>.02 && !v.seeking) v.currentTime=tt; }
  });
}
useDemo();
function loadMedia(i,file,lab,name){
  if(!file) return; const url=URL.createObjectURL(file); const m=media[i];
  if(file.type.startsWith('video')){
    setMediaVideo(i,makeVideo(url),true);
  } else {
    if(m.el && m.video){ m.el.pause(); }
    const img=new Image(); img.onload=()=>{ m.w=img.naturalWidth; m.h=img.naturalHeight; m.el=img; m.video=false; m.user=true; uploadMedia(i); }; img.src=url;
  }
  lab.firstChild.textContent='✓ '+name;
}

// zip (store, no compression)
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,0,true); h.setUint16(12,33,true); h.setUint32(14,crc,true); h.setUint32(18,size,true); h.setUint32(22,size,true);
    h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer,name,f.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,0,true); c.setUint16(14,33,true); c.setUint32(16,crc,true); c.setUint32(20,size,true); c.setUint32(24,size,true);
    c.setUint16(28,name.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true); c.setUint16(34,0,true); c.setUint16(36,0,true);
    c.setUint32(38,0,true); c.setUint32(42,off,true);
    central.push(c.buffer,name);
    off+=30+name.length+size;
  }
  const cdSize=central.reduce((a,b)=>a+(b.byteLength!=null?b.byteLength:b.length),0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts,...central,e.buffer],{type:'application/zip'});
}

async function exportPNG(){
  lockUI(true);
  try{
    const [W,H]=fullSize(); setSize(W,H);
    const g = st.kind==='video' ? growAt(curT) : st.progress, t = st.kind==='video'?curT:0;
    draw(g,t,{view:0}, st.kind==='video'?creepAt(curT):st.progress); const b=await canvasBlob();
    await saveFile(`trafaret_${shapeSlug(st)}_${st.seed}_${W}x${H}.png`, b);
  } finally { lockUI(false); }
}
async function exportPack(){
  lockUI(true);
  try{
    const [W,H]=fullSize(); setSize(W,H); const files=[];
    for(let i=0;i<12;i++){
      const s=Object.assign({},st,randomParams(false),{kind:'image'});
      draw(1,0,{view:0,state:s},1); const b=await canvasBlob();
      files.push({name:`${String(i+1).padStart(2,'0')}_${shapeSlug(s)}.png`, data:new Uint8Array(await b.arrayBuffer())});
      setProgress((i+1)/12); await nextFrame();
    }
    await saveFile(`VALPOD_trafarety_pack_${W}x${H}.zip`, makeZip(files));
  } finally { lockUI(false); }
}
async function exportSeq(){
  lockUI(true);
  try{
    const [W,H]=fullSize(); setSize(W,H); const N=Math.max(1,Math.round(st.dur*st.fps)), files=[];
    for(let i=0;i<N;i++){
      const t=i/st.fps; draw(growAt(t),t,{view:0},creepAt(t)); const b=await canvasBlob();
      files.push({name:`trafaret_${String(i).padStart(4,'0')}.png`, data:new Uint8Array(await b.arrayBuffer())});
      if(i%3===0){ setProgress((i+1)/N); await nextFrame(); }
    }
    await saveFile(`trafaret_${shapeSlug(st)}_${st.seed}_${st.dur}s_${st.fps}fps_png.zip`, makeZip(files));
  } finally { lockUI(false); }
}
async function encodeWebCodecs(W,H,vmode){
  if(!window.VideoEncoder || !window.VideoFrame || !window.Mp4Muxer) return null;
  const fps=st.fps, N=Math.max(1,Math.round(st.dur*fps)), bitrate=W*H>4e6?40e6:16e6;
  let codec=null;
  for(const c of ['avc1.640034','avc1.640033','avc1.640028','avc1.4d0034','avc1.42003e']){
    try{ const r=await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate,framerate:fps}); if(r.supported){ codec=c; break; } }catch(e){}
  }
  if(!codec) return null;
  const target=new Mp4Muxer.ArrayBufferTarget();
  const muxer=new Mp4Muxer.Muxer({target, video:{codec:'avc',width:W,height:H,frameRate:fps}, fastStart:'in-memory'});
  let err=null;
  const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m), error:e=>err=e});
  enc.configure({codec,width:W,height:H,bitrate,framerate:fps,avc:{format:'avc'}});
  for(let i=0;i<N;i++){
    if(err) throw err;
    const t=i/fps; draw(growAt(t),t,{view:0,mode:vmode},creepAt(t));
    const fr=new VideoFrame(canvas,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
    enc.encode(fr,{keyFrame:i%(fps*2)===0}); fr.close();
    while(enc.encodeQueueSize>6) await new Promise(r=>setTimeout(r,4));
    if(i%4===0){ setProgress((i+1)/N); await nextFrame(); }
  }
  await enc.flush(); enc.close(); if(err) throw err;
  muxer.finalize();
  return new Blob([target.buffer],{type:'video/mp4'});
}
async function encodeRecorder(W,H,vmode){
  if(!window.MediaRecorder || !canvas.captureStream) return null;
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t)); if(!mime) return null;
  const stream=canvas.captureStream(st.fps);
  const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond: W*H>4e6?40e6:16e6});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>rec.onstop=r);
  draw(growAt(0),0,{view:0,mode:vmode},0); rec.start(100);
  const start=performance.now(), D=st.dur*1000;
  await new Promise(res=>{ const step=()=>{ const el=performance.now()-start; const t=Math.min(el,D)/1000;
    draw(growAt(t),t,{view:0,mode:vmode},creepAt(t)); setProgress(el/D); if(el>=D+60) res(); else requestAnimationFrame(step); }; requestAnimationFrame(step); });
  rec.stop(); await done; stream.getTracks().forEach(t=>t.stop());
  return {blob:new Blob(chunks,{type:mime.split(';')[0]}), ext: mime.startsWith('video/mp4')?'mp4':'webm'};
}
async function exportVideo(){
  lockUI(true);
  try{
    const [W,H]=fullSize(); setSize(W,H);
    const vmode = st.mode===2 ? 2 : 1;
    const base=`trafaret_${shapeSlug(st)}_${st.seed}_${st.dur}s_${st.fps}fps_luma`;
    const b=await encodeWebCodecs(W,H,vmode);
    if(b){ await saveFile(base+'.mp4', b); return; }
    const r=await encodeRecorder(W,H,vmode);
    if(!r){ toast('Этот браузер не умеет писать видео — возьми PNG-секвенцию.'); return; }
    await saveFile(base+'.'+r.ext, r.blob);
    if(r.ext==='webm') toast('Браузер пишет только WebM — Premiere его откроет, или возьми PNG-секвенцию.');
  } catch(e){ toast('Ошибка записи: '+(e.message||e)); }
  finally { lockUI(false); }
}

refresh();
requestAnimationFrame(loop);
window.__mask = {st, draw, setSize, growAt, randomParams, refresh, makeZip};
})();
